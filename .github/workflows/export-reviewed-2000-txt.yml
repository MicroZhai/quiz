name: Export Reviewed 2000 Questions TXT

on:
  push:
    paths:
      - '.github/workflows/export-reviewed-2000-txt.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Export reviewed bank to TXT
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          ROOT = Path('.')
          OUT = ROOT / 'audit' / 'export_txt'
          OUT.mkdir(parents=True, exist_ok=True)
          bank_id = 'metal_heat_treatment_2000_reviewed_2026'
          questions = json.loads((ROOT/'questions.json').read_text(encoding='utf-8'))
          items = [q for q in questions if q.get('source_bank') == bank_id]
          items.sort(key=lambda q: int(q.get('source_index', 0)))
          assert len(items) == 2000, f'expected 2000, got {len(items)}'

          type_name = {
              'choice':'选择题', 'truefalse':'判断题',
              'shortanswer':'简答/案例题', 'fill':'填空题', 'calculation':'计算题'
          }
          status_name = {
              'reviewed':'人工审校通过',
              'fixed':'审校后修订',
              'composite_verified':'强化题校验通过',
          }

          def fmt(q):
              idx = int(q.get('source_index', 0))
              lines = [
                  '=' * 72,
                  f'【第 {idx} 题】{type_name.get(q.get("type"), q.get("type", ""))}',
                  f'等级：{q.get("source_level", "")}',
                  f'知识点：{q.get("knowledge_point", "综合")}',
                  f'审校状态：{status_name.get(q.get("review_status"), q.get("review_status", ""))}',
                  f'正式题库ID：{q.get("id", "")}', '',
                  '题目：', str(q.get('question','')).strip()
              ]
              opts = q.get('options') or []
              labels = q.get('option_labels') or []
              if opts:
                  lines += ['', '选项：']
                  for i,opt in enumerate(opts):
                      label = labels[i] if i < len(labels) else chr(65+i)
                      lines.append(f'{label}. {opt}')
              lines += ['', '参考答案：' if q.get('type') == 'shortanswer' else '正确答案：', str(q.get('answer','')).strip(), '', '学习型解析：', str(q.get('explanation','')).strip()]
              basis = str(q.get('review_basis','')).strip()
              if basis:
                  lines += ['', '审校依据/说明：', basis]
              lines.append('')
              return '\n'.join(lines)

          header = '''金属热处理工考工晋级大题库（2000题审校版）\n\n本文件为网页正式题库中“2000题审校版”的最终正文导出。\n内容以实际入库后的题干、选项、答案、学习型解析和知识点为准。\n共2000题。\n\n特别说明：\n- 第262、263题：原单选题存在45钢/40Cr均可成立的歧义，已修订题干使答案唯一。\n- 第2000题：已清理原资料误粘入D选项末尾的“题库完成说明”。\n- 其余题目以审校后的最终答案为准，并补充学习型解析。\n\n'''

          all_text = [header]
          for old in OUT.glob('part_*.txt'):
              old.unlink()
          for part in range(10):
              start = part * 200
              block = items[start:start+200]
              part_text = [f'########## 第 {part+1} 卷：第 {start+1}—{start+len(block)} 题 ##########\n']
              part_text.extend(fmt(q) for q in block)
              txt = '\n'.join(part_text)
              (OUT / f'part_{part+1:02d}.txt').write_text(txt, encoding='utf-8')
              all_text.append(txt)

          full = OUT / '金属热处理工2000题审校版完整.txt'
          full.write_text('\n'.join(all_text), encoding='utf-8')
          print(f'full: {full} / {full.stat().st_size} bytes')
          assert '【第 1 题】' in full.read_text(encoding='utf-8')
          assert '【第 2000 题】' in full.read_text(encoding='utf-8')
          PY

      - name: Upload complete TXT artifact
        uses: actions/upload-artifact@v4
        with:
          name: reviewed-2000-txt
          path: audit/export_txt/金属热处理工2000题审校版完整.txt
          if-no-files-found: error
          compression-level: 0

      - name: Commit exported TXT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/export_txt
          if git diff --cached --quiet; then
            echo "No export changes"
          else
            git commit -m "导出完整2000题审校版TXT正文"
            git push
          fi
