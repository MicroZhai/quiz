name: Integrate Reviewed 2000 Question Bank

on:
  push:
    paths:
      - '.github/workflows/integrate-reviewed-2000.yml'
      - 'tools/integrate_reviewed_2000.py'
      - 'tools/apply_review_fixes.py'
      - 'tools/validate_imported_bank.py'
      - 'audit/reviews/**'
      - 'audit/parsed_2000.json'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run reviewed-bank pipeline with diagnostics
        id: pipeline
        shell: bash
        run: |
          set +e
          mkdir -p audit
          : > audit/INTEGRATION_DIAGNOSTIC.md
          echo '# 2000题导入自动验收诊断' >> audit/INTEGRATION_DIAGNOSTIC.md
          echo >> audit/INTEGRATION_DIAGNOSTIC.md
          overall=0

          run_check() {
            title="$1"
            shift
            tmp="$(mktemp)"
            echo "## ${title}" >> audit/INTEGRATION_DIAGNOSTIC.md
            echo >> audit/INTEGRATION_DIAGNOSTIC.md
            "$@" >"$tmp" 2>&1
            code=$?
            echo "退出码：${code}" >> audit/INTEGRATION_DIAGNOSTIC.md
            echo >> audit/INTEGRATION_DIAGNOSTIC.md
            echo '```text' >> audit/INTEGRATION_DIAGNOSTIC.md
            cat "$tmp" >> audit/INTEGRATION_DIAGNOSTIC.md
            echo '```' >> audit/INTEGRATION_DIAGNOSTIC.md
            echo >> audit/INTEGRATION_DIAGNOSTIC.md
            cat "$tmp"
            rm -f "$tmp"
            if [ "$code" -ne 0 ]; then overall=1; fi
            return "$code"
          }

          run_check '合并审校题库' python tools/integrate_reviewed_2000.py || true
          if [ "$overall" -eq 0 ]; then run_check '应用修题与简答格式' python tools/apply_review_fixes.py || true; fi
          if [ "$overall" -eq 0 ]; then run_check '题库数据校验' python validate_quiz.py --data-only || true; fi
          if [ "$overall" -eq 0 ]; then run_check '生成 questions.js' python build_quiz.py || true; fi
          if [ "$overall" -eq 0 ]; then run_check '2000题专项验收' python tools/validate_imported_bank.py || true; fi
          if [ "$overall" -eq 0 ]; then run_check '网页结构验收' python validate_quiz.py || true; fi

          if [ "$overall" -eq 0 ]; then
            python - <<'PY' >> audit/INTEGRATION_DIAGNOSTIC.md 2>&1
          import json, re
          from pathlib import Path
          root = Path('.')
          count = len(json.loads((root/'questions.json').read_text(encoding='utf-8')))
          sw = root/'service-worker.js'
          text = sw.read_text(encoding='utf-8')
          text = re.sub(r"const CACHE_VERSION = '[^']+';", f"const CACHE_VERSION = 'quiz-learning-q{count}-reviewed-v1';", text, count=1)
          sw.write_text(text, encoding='utf-8')
          print(f'\n## PWA缓存\n\n已更新到题数 {count}。')
          PY
          fi

          echo "pipeline_ok=$((1-overall))" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit diagnostic report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/INTEGRATION_DIAGNOSTIC.md
          if ! git diff --cached --quiet; then
            git commit -m "记录2000题导入验收诊断"
            git push
          fi

      - name: Commit reviewed bank and generated files
        if: steps.pipeline.outputs.pipeline_ok == '1'
        run: |
          git pull --rebase
          git add questions.json questions.js service-worker.js audit/FINAL_IMPORT_REPORT.md
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "合并审校后的2000题到正式题库"
            git push
          fi

      - name: Fail workflow if validation failed
        if: steps.pipeline.outputs.pipeline_ok != '1'
        run: |
          echo "Reviewed-bank pipeline failed. See audit/INTEGRATION_DIAGNOSTIC.md"
          exit 1
