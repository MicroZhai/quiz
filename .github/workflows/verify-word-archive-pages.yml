name: Verify Word Archive Bank on Pages

on:
  push:
    paths:
      - '.github/workflows/verify-word-archive-pages.yml'
      - 'questions.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verify-word-archive-pages
  cancel-in-progress: true

jobs:
  verify-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read expected bank state
        id: expected
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          q=json.load(open('questions.json',encoding='utf-8'))
          word=sum(x.get('source_bank')=='word_archive_reviewed_2026' for x in q)
          print(f'count={len(q)}')
          print(f'word={word}')
          PY

      - name: Wait for GitHub Pages and verify online files
        env:
          EXPECTED: ${{ steps.expected.outputs.count }}
          EXPECTED_WORD: ${{ steps.expected.outputs.word }}
        run: |
          set -e
          BASE='https://microzhai.github.io/quiz'
          ok=0
          for i in $(seq 1 18); do
            echo "Pages check $i/18"
            if curl -fsSL --max-time 30 "$BASE/questions.json?verify=$GITHUB_RUN_ID-$i" -o /tmp/online_questions.json && \
               curl -fsSL --max-time 30 "$BASE/manifest.webmanifest?verify=$GITHUB_RUN_ID-$i" -o /tmp/manifest.webmanifest && \
               curl -fsSL --max-time 30 "$BASE/sw.js?verify=$GITHUB_RUN_ID-$i" -o /tmp/sw.js; then
              if python - <<'PY'
          import json, os
          q=json.load(open('/tmp/online_questions.json',encoding='utf-8'))
          expected=int(os.environ['EXPECTED']); expected_word=int(os.environ['EXPECTED_WORD'])
          word=sum(x.get('source_bank')=='word_archive_reviewed_2026' for x in q)
          assert len(q)==expected,(len(q),expected)
          assert word==expected_word,(word,expected_word)
          json.load(open('/tmp/manifest.webmanifest',encoding='utf-8'))
          assert open('/tmp/sw.js',encoding='utf-8').read().strip()
          print('online OK',len(q),word)
          PY
              then ok=1; break; fi
            fi
            sleep 10
          done
          if [ "$ok" != 1 ]; then
            echo 'Pages did not converge to expected bank state' >&2
            exit 1
          fi

      - name: Write online verification report
        env:
          EXPECTED: ${{ steps.expected.outputs.count }}
          EXPECTED_WORD: ${{ steps.expected.outputs.word }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          q=json.load(open('/tmp/online_questions.json',encoding='utf-8'))
          report=f'''# Word题库 GitHub Pages / PWA 线上验收\n\n- 状态：PASS\n- 线上正式题库：{len(q)} 题\n- 线上 Word 压缩包来源题：{sum(x.get("source_bank")=="word_archive_reviewed_2026" for x in q)} 题\n- manifest：可读取并解析\n- Service Worker：可读取\n- 线上题库与 main 分支题数：一致\n'''
          Path('audit/WORD_ARCHIVE_PAGES_STATUS.md').write_text(report,encoding='utf-8')
          print(report)
          PY

      - name: Commit verification report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/WORD_ARCHIVE_PAGES_STATUS.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m '记录Word题库PWA线上验收结果'
          git pull --rebase origin main
          git push origin main
