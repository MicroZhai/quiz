<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f5f0">
<title>刷题学习</title>
<style>
:root {
  --canvas:#f6f5f0;
  --surface:#fffdfa;
  --surface-soft:#f0f4f1;
  --surface-strong:#e7efeb;
  --text:#1f2724;
  --text-2:#58625e;
  --text-3:#87908c;
  --line:#dfe4e0;
  --line-strong:#cdd5d0;
  --accent:#176b5a;
  --accent-hover:#115949;
  --accent-soft:#e5f1ed;
  --success:#2d7a52;
  --success-soft:#e7f3ec;
  --danger:#b34f4d;
  --danger-soft:#f8eaea;
  --warning:#b57927;
  --warning-soft:#faf0dc;
  --radius-s:8px;
  --radius-m:12px;
  --radius-l:16px;
  --control:44px;
  --shadow-float:0 12px 32px rgba(36,48,43,.10);
  --content:960px;
  --reading:720px;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
}
:root[data-theme="dark"] {
  --canvas:#151917;
  --surface:#1b201e;
  --surface-soft:#202824;
  --surface-strong:#29352f;
  --text:#edf2ef;
  --text-2:#b2bdb8;
  --text-3:#7f8b85;
  --line:#303a35;
  --line-strong:#3d4943;
  --accent:#72b9a7;
  --accent-hover:#8cc9ba;
  --accent-soft:#20372f;
  --success:#73b990;
  --success-soft:#20352a;
  --danger:#e0807e;
  --danger-soft:#3a2424;
  --warning:#d7a65d;
  --warning-soft:#392f20;
  --shadow-float:0 16px 38px rgba(0,0,0,.28);
}
@media (prefers-color-scheme:dark) {
  :root:not([data-theme="light"]):not([data-theme="dark"]) {
    --canvas:#151917;--surface:#1b201e;--surface-soft:#202824;--surface-strong:#29352f;
    --text:#edf2ef;--text-2:#b2bdb8;--text-3:#7f8b85;--line:#303a35;--line-strong:#3d4943;
    --accent:#72b9a7;--accent-hover:#8cc9ba;--accent-soft:#20372f;--success:#73b990;--success-soft:#20352a;
    --danger:#e0807e;--danger-soft:#3a2424;--warning:#d7a65d;--warning-soft:#392f20;--shadow-float:0 16px 38px rgba(0,0,0,.28);
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--canvas);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.65;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input{font:inherit}
button{color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 28%,transparent);outline-offset:2px}
.app-header{position:sticky;inset-block-start:0;z-index:20;background:color-mix(in srgb,var(--canvas) 88%,transparent);backdrop-filter:blur(16px);border-block-end:1px solid var(--line)}
.header-inner{max-width:var(--content);height:64px;margin-inline:auto;padding-inline:24px;display:flex;align-items:center;gap:28px}
.brand{display:flex;align-items:center;gap:10px;font-weight:760;letter-spacing:.01em;white-space:nowrap}
.brand-mark{width:30px;height:30px;border-radius:9px;background:var(--accent);color:#fff;display:grid;place-items:center}
.brand-mark svg{width:18px;height:18px}
.desktop-nav{display:flex;align-items:stretch;gap:6px;height:100%;margin-inline-start:auto}
.nav-btn{position:relative;min-width:72px;padding-inline:14px;border:0;background:transparent;color:var(--text-2);cursor:pointer}
.nav-btn::after{content:"";position:absolute;inset-inline:17px;inset-block-end:0;height:3px;border-radius:3px;background:transparent}
.nav-btn:hover{color:var(--text)}
.nav-btn.active{color:var(--accent);font-weight:700}
.nav-btn.active::after{background:var(--accent)}
main{max-width:var(--content);margin-inline:auto;padding:36px 24px 80px}
.page{animation:page-in .18s ease both}
@keyframes page-in{from{opacity:.45;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-block-end:26px}
.page-title{font-size:28px;line-height:1.25;margin:0;font-weight:760;letter-spacing:-.02em}
.page-sub{margin:6px 0 0;color:var(--text-2);font-size:14px}
.section{margin-block-start:34px}
.section:first-child{margin-block-start:0}
.section-title-row{display:flex;align-items:baseline;justify-content:space-between;gap:16px;margin-block-end:12px}
.section-title{font-size:17px;margin:0;font-weight:720}
.section-note{font-size:12px;color:var(--text-3)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-l)}
.continue-panel{display:grid;grid-template-columns:1fr auto;gap:24px;align-items:center;padding:24px}
.eyebrow{font-size:12px;color:var(--accent);font-weight:700;margin-block-end:5px}
.continue-title{font-size:20px;font-weight:730;margin:0 0 8px}
.continue-meta{color:var(--text-2);font-size:13px}
.progress{height:6px;background:var(--line);border-radius:999px;overflow:hidden;margin-block-start:14px;max-width:520px}
.progress-fill{height:100%;background:var(--accent);border-radius:inherit;transition:width .25s ease}
.primary,.secondary,.ghost,.danger-btn{min-height:var(--control);border-radius:var(--radius-s);padding-inline:18px;border:1px solid transparent;cursor:pointer;font-weight:650;transition:background .15s,border-color .15s,transform .08s}
.primary{background:var(--accent);color:#fff}
.primary:hover{background:var(--accent-hover)}
.secondary{background:var(--surface);border-color:var(--line-strong)}
.secondary:hover{border-color:var(--accent);color:var(--accent)}
.ghost{background:transparent;color:var(--text-2)}
.ghost:hover{background:var(--surface-soft);color:var(--text)}
.danger-btn{background:transparent;border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger)}
button:active{transform:scale(.985)}
button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);overflow:hidden}
.stat{padding:18px 20px;text-align:center;position:relative}
.stat+.stat{border-inline-start:1px solid var(--line)}
.stat-value{font-size:24px;font-weight:760;line-height:1.2;font-variant-numeric:tabular-nums}
.stat-label{font-size:12px;color:var(--text-3);margin-block-start:5px}
.list{border-block:1px solid var(--line)}
.list-row{width:100%;min-height:66px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;padding:12px 2px;border:0;border-block-end:1px solid var(--line);background:transparent;text-align:start;cursor:pointer}
.list-row:last-child{border-block-end:0}
.list-row:hover .row-title{color:var(--accent)}
.row-title{font-weight:650;min-width:0}
.row-meta{font-size:12px;color:var(--text-3);margin-block-start:3px}
.row-side{display:flex;align-items:center;gap:12px;color:var(--text-3);font-size:13px}
.chev{width:18px;height:18px;display:block}
.chapter-progress{width:92px;height:4px;background:var(--line);border-radius:999px;overflow:hidden}
.chapter-progress>span{display:block;height:100%;background:var(--accent);border-radius:inherit}
.quick-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick{min-height:76px;padding:14px 16px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);text-align:start;cursor:pointer}
.quick:hover{border-color:var(--line-strong);background:var(--surface-soft)}
.quick strong{display:block;font-size:15px}
.quick span{display:block;color:var(--text-3);font-size:12px;margin-block-start:3px}
.practice-grid{display:grid;grid-template-columns:280px minmax(0,1fr);gap:28px;align-items:start}
.mode-panel{padding:8px;position:sticky;inset-block-start:88px}
.mode-btn{width:100%;border:0;background:transparent;border-radius:9px;padding:12px 13px;text-align:start;cursor:pointer;color:var(--text-2);display:flex;justify-content:space-between;gap:10px}
.mode-btn:hover{background:var(--surface-soft);color:var(--text)}
.mode-btn.active{background:var(--accent-soft);color:var(--accent);font-weight:700}
.mode-btn small{font-size:11px;color:var(--text-3);font-weight:500}
.library{min-width:0}
.library-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding-block-end:12px;border-block-end:1px solid var(--line)}
.library-title{font-size:18px;font-weight:720}
.library-count{font-size:12px;color:var(--text-3)}
.empty{padding:54px 20px;text-align:center;color:var(--text-2)}
.empty strong{display:block;color:var(--text);font-size:18px;margin-block-end:5px}
.question-shell{max-width:var(--reading);margin-inline:auto;padding-block-end:88px}
.question-top{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;margin-block-end:20px}
.icon-btn{width:40px;height:40px;border:1px solid var(--line);background:var(--surface);border-radius:10px;display:grid;place-items:center;cursor:pointer;color:var(--text-2)}
.icon-btn:hover{color:var(--accent);border-color:var(--line-strong)}
.icon-btn svg{width:19px;height:19px}
.q-progress-wrap{min-width:0}
.q-meta-line{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:12px;color:var(--text-3);margin-block-end:7px}
.q-progress{height:5px;background:var(--line);border-radius:999px;overflow:hidden}
.q-progress>span{display:block;height:100%;background:var(--accent);border-radius:inherit}
.question-card{padding:26px 0 0}
.type-label{font-size:12px;color:var(--accent);font-weight:720;margin-block-end:8px}
.question-text{font-size:21px;font-weight:650;line-height:1.7;letter-spacing:.005em;margin-block-end:24px;white-space:pre-wrap}
.options{display:grid;gap:10px}
.option{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) 22px;gap:12px;align-items:center;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);text-align:start;cursor:pointer;min-height:58px}
.option:hover:not(:disabled){border-color:var(--line-strong);background:var(--surface-soft)}
.option-letter{width:30px;height:30px;border:1px solid var(--line-strong);border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--text-2)}
.option.selected{border-color:color-mix(in srgb,var(--accent) 55%,var(--line));background:var(--accent-soft)}
.option.selected .option-letter{background:var(--accent);color:#fff;border-color:var(--accent)}
.option.correct{border-color:color-mix(in srgb,var(--success) 50%,var(--line));background:var(--success-soft)}
.option.correct .option-letter{background:var(--success);color:#fff;border-color:var(--success)}
.option.wrong{border-color:color-mix(in srgb,var(--danger) 50%,var(--line));background:var(--danger-soft)}
.option.wrong .option-letter{background:var(--danger);color:#fff;border-color:var(--danger)}
.option-state{display:grid;place-items:center}
.option-state svg{width:18px;height:18px}
.answer-actions{display:flex;gap:10px;margin-block-start:14px}
.fill-wrap{display:grid;grid-template-columns:1fr auto;gap:10px}
.text-input{height:48px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);border-radius:var(--radius-s);padding-inline:14px;min-width:0}
.feedback{margin-block-start:24px;padding:18px 20px;background:var(--surface-soft);border-radius:var(--radius-m);border-inline-start:3px solid var(--accent)}
.feedback.correct{border-inline-start-color:var(--success)}
.feedback.wrong{border-inline-start-color:var(--danger)}
.feedback-title{font-weight:760;margin-block-end:8px}
.feedback-text{color:var(--text-2);line-height:1.8;white-space:pre-wrap}
.answer-line{margin-block-end:9px;font-weight:650;color:var(--text)}
.kp-line{display:flex;align-items:center;gap:8px;margin-block-start:13px;padding-block-start:12px;border-block-start:1px solid var(--line);font-size:12px;color:var(--text-3)}
.kp-chip{padding:3px 8px;background:var(--surface);border:1px solid var(--line);border-radius:999px;color:var(--text-2)}
.question-footer{position:fixed;z-index:15;inset-inline:0;inset-block-end:0;background:color-mix(in srgb,var(--canvas) 92%,transparent);backdrop-filter:blur(16px);border-block-start:1px solid var(--line)}
.question-footer-inner{max-width:var(--reading);margin-inline:auto;padding:12px 24px calc(12px + env(safe-area-inset-bottom));display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.footer-spacer{min-width:0}
.mistake-summary{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);overflow:hidden}
.mistake-stat{padding:18px;text-align:center}
.mistake-stat+.mistake-stat{border-inline-start:1px solid var(--line)}
.mistake-stat strong{display:block;font-size:24px;font-variant-numeric:tabular-nums}
.mistake-stat span{font-size:12px;color:var(--text-3)}
.weak-list{display:grid;gap:8px}
.weak-row{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:16px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m)}
.weak-row button{border:0;background:transparent;color:var(--accent);cursor:pointer;padding:4px 0;font-weight:650}
.mistake-item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;padding:16px 2px;border-block-end:1px solid var(--line);cursor:pointer}
.mistake-item:last-child{border-block-end:0}
.mistake-item:hover .mistake-q{color:var(--accent)}
.mistake-q{font-weight:620;line-height:1.65}
.tagline{font-size:12px;color:var(--text-3);margin-block-start:4px}
.settings-list{border-block:1px solid var(--line)}
.setting-row{min-height:68px;padding:12px 2px;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:18px;border-block-end:1px solid var(--line)}
.setting-row:last-child{border-block-end:0}
.setting-label{font-weight:650}
.setting-desc{font-size:12px;color:var(--text-3);margin-block-start:3px}
.segmented{display:flex;padding:3px;border:1px solid var(--line);background:var(--surface);border-radius:9px}
.segmented button{height:34px;border:0;background:transparent;border-radius:6px;padding-inline:10px;color:var(--text-2);cursor:pointer;font-size:13px}
.segmented button.active{background:var(--surface-strong);color:var(--accent);font-weight:700}
.toast{position:fixed;z-index:50;inset-inline-start:50%;inset-block-end:24px;transform:translateX(-50%) translateY(12px);background:var(--text);color:var(--canvas);padding:9px 14px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:.18s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.mobile-nav{display:none}
.mobile-nav-inner{display:grid;grid-template-columns:repeat(4,1fr)}
.mobile-nav button{height:58px;border:0;background:transparent;color:var(--text-3);font-size:12px;position:relative}
.mobile-nav button.active{color:var(--accent);font-weight:700}
.mobile-nav button.active::before{content:"";position:absolute;inset-block-start:0;inset-inline:30%;height:2px;background:var(--accent);border-radius:0 0 2px 2px}
@media(max-width:760px){
  .header-inner{height:56px;padding-inline:16px}.desktop-nav{display:none}.brand{font-size:15px}.brand-mark{width:28px;height:28px}
  main{padding:26px 16px 90px}.page-title{font-size:24px}.page-head{margin-block-end:22px}.continue-panel{grid-template-columns:1fr;padding:20px;gap:18px}.continue-panel .primary{width:100%}
  .quick-actions{grid-template-columns:1fr}.practice-grid{grid-template-columns:1fr;gap:18px}.mode-panel{position:static;display:flex;gap:6px;overflow-x:auto;padding:5px}.mode-btn{width:auto;min-width:max-content;padding:10px 12px}.mode-btn small{display:none}
  .chapter-progress{display:none}.question-shell{padding-block-end:82px}.question-top{grid-template-columns:auto 1fr auto}.question-card{padding-block-start:14px}.question-text{font-size:19px;margin-block-end:20px}.option{min-height:56px;padding:12px}.fill-wrap{grid-template-columns:1fr}.fill-wrap .primary{width:100%}
  .question-footer-inner{padding-inline:16px}.question-footer .secondary{padding-inline:12px}.question-footer .primary{padding-inline:16px}
  .mobile-nav{display:block;position:fixed;z-index:25;inset-inline:0;inset-block-end:0;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(16px);border-block-start:1px solid var(--line);padding-block-end:env(safe-area-inset-bottom)}
  body.in-question .app-header{display:none}body.in-question .mobile-nav{display:none}body.in-question main{padding-block-start:22px;padding-block-end:80px}.toast{inset-block-end:78px}body.in-question .toast{inset-block-end:78px}
}
@media(max-width:420px){.stats-row,.mistake-summary{grid-template-columns:repeat(3,1fr)}.stat,.mistake-stat{padding:15px 8px}.stat-value,.mistake-stat strong{font-size:21px}.question-footer-inner{grid-template-columns:1fr 1fr}.question-footer-inner .secondary,.question-footer-inner .primary{width:100%}.footer-spacer{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-inner">
    <div class="brand" aria-label="刷题学习">
      <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5c3.1-.8 5.7-.1 8 1.6v12c-2.3-1.7-4.9-2.4-8-1.6z"/><path d="M20 5.5c-3.1-.8-5.7-.1-8 1.6v12c2.3-1.7 4.9-2.4 8-1.6z"/></svg></span>
      <span>刷题学习</span>
    </div>
    <nav class="desktop-nav" aria-label="主要导航">
      <button class="nav-btn active" data-nav="home">首页</button>
      <button class="nav-btn" data-nav="practice">练习</button>
      <button class="nav-btn" data-nav="mistakes">错题</button>
      <button class="nav-btn" data-nav="profile">我的</button>
    </nav>
  </div>
</header>
<main id="app" aria-live="polite"></main>
<nav class="mobile-nav" aria-label="移动端主要导航">
  <div class="mobile-nav-inner">
    <button class="active" data-nav="home">首页</button>
    <button data-nav="practice">练习</button>
    <button data-nav="mistakes">错题</button>
    <button data-nav="profile">我的</button>
  </div>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="questions.js"></script>
<script>
'use strict';
const QUESTIONS = Array.isArray(window.ALL_QUESTIONS) ? window.ALL_QUESTIONS : [];
const STORAGE_KEY = 'heat_treatment_quiz';
const STATE_VERSION = 2;
const TOPICS = [...new Set(QUESTIONS.map(q => q.topic || '综合复习'))];
const TYPE_NAMES = {choice:'选择题',truefalse:'判断题',fill:'填空题',shortanswer:'简答题',calculation:'计算题'};
const MODE_LABELS = {sequence:'顺序练习',random:'随机练习',unseen:'未做题'};

function freshState(){return{version:STATE_VERSION,stats:{total:0,correct:0},daily:{},questionStats:{},mistakes:{},mastered:{},lastSession:null,theme:'auto'}}
function loadState(){
  try{
    const raw=localStorage.getItem(STORAGE_KEY); if(!raw)return freshState();
    const old=JSON.parse(raw); if(old&&old.version===STATE_VERSION)return Object.assign(freshState(),old);
    const next=freshState();
    next.stats={total:Number(old?.stats?.total||0),correct:Number(old?.stats?.correct||0)};
    if(old?.stats?.dailyActivity){Object.entries(old.stats.dailyActivity).forEach(([d,n])=>next.daily[d]={answered:Number(n||0),correct:0})}
    if(old?.mistakes){Object.keys(old.mistakes).forEach(id=>next.mistakes[id]={wrongCount:1,correctStreak:0,lastWrongAt:Date.now()})}
    localStorage.setItem(STORAGE_KEY,JSON.stringify(next)); return next;
  }catch(e){return freshState()}
}
let state=loadState();
let view='home';
let practiceMode='sequence';
let session=null;
let currentIndex=0;
let answerState={};
let selectedMulti=new Set();
let toastTimer=null;

function save(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state))}
function todayKey(){const d=new Date();const y=d.getFullYear();const m=String(d.getMonth()+1).padStart(2,'0');const day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function textWithBreaks(v){return esc(v).replace(/\n/g,'<br>')}
function normalize(v){return String(v??'').trim().toLowerCase().replace(/\s+/g,'').replace(/[，,、；;。．.：:（）()\[\]【】]/g,'')}
function qById(id){return QUESTIONS.find(q=>String(q.id)===String(id))}
function topicQuestions(topic){return topic==='all'?QUESTIONS:QUESTIONS.filter(q=>(q.topic||'综合复习')===topic)}
function uniqueDoneCount(list){return list.reduce((n,q)=>n+(state.questionStats[q.id]?.attempts>0?1:0),0)}
function rate(){return state.stats.total?Math.round(state.stats.correct/state.stats.total*100):0}
function dailyStats(){return state.daily[todayKey()]||{answered:0,correct:0}}
function activeMistakeIds(){return Object.keys(state.mistakes).filter(id=>qById(id))}
function shuffle(arr){const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function showToast(msg){const el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1800)}
function icon(name){
  const p={chev:'<path d="m9 6 6 6-6 6"/>',back:'<path d="m15 18-6-6 6-6"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9z"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="M6 6l12 12M18 6 6 18"/>',book:'<path d="M4 5.5c3.1-.8 5.7-.1 8 1.6v12c-2.3-1.7-4.9-2.4-8-1.6z"/><path d="M20 5.5c-3.1-.8-5.7-.1-8 1.6v12c2.3-1.7 4.9-2.4 8-1.6z"/>'};
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p[name]||''}</svg>`
}
function setTheme(theme){state.theme=theme;save();applyTheme();render()}
function applyTheme(){const t=state.theme||'auto';if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t)}
applyTheme();

function navigate(target){view=target;session=null;answerState={};selectedMulti.clear();document.body.classList.remove('in-question');window.scrollTo({top:0,behavior:'auto'});render()}
function updateNav(){document.querySelectorAll('[data-nav]').forEach(b=>b.classList.toggle('active',b.dataset.nav===view))}
function render(){const app=document.getElementById('app');if(!app)return;if(view==='home')app.innerHTML=renderHome();else if(view==='practice')app.innerHTML=renderPractice();else if(view==='mistakes')app.innerHTML=renderMistakes();else if(view==='profile')app.innerHTML=renderProfile();else if(view==='question')app.innerHTML=renderQuestion();else app.innerHTML=renderHome();updateNav();bind();}

function renderHome(){
  const day=dailyStats();const dayRate=day.answered?Math.round(day.correct/day.answered*100):0;const done=uniqueDoneCount(QUESTIONS);const total=QUESTIONS.length;const pct=total?Math.round(done/total*100):0;
  const hasLast=state.lastSession&&Array.isArray(state.lastSession.ids)&&state.lastSession.ids.some(id=>qById(id));
  const continueTitle=hasLast?(state.lastSession.title||'继续上次练习'):'从热处理基础开始';
  const continueMeta=hasLast?`上次做到第 ${Math.min((state.lastSession.index||0)+1,state.lastSession.ids.length)} / ${state.lastSession.ids.length} 题`:`题库共 ${total} 题，按章节逐步练习`;
  return `<div class="page">
    <div class="page-head"><div><h1 class="page-title">热处理学习</h1><p class="page-sub">把题做懂，比把功能做多更重要。</p></div></div>
    <section class="section">
      <div class="continue-panel panel">
        <div><div class="eyebrow">继续学习</div><h2 class="continue-title">${esc(continueTitle)}</h2><div class="continue-meta">${esc(continueMeta)}</div><div class="progress"><div class="progress-fill" style="width:${pct}%"></div></div></div>
        <button class="primary" data-action="${hasLast?'continue':'start-default'}">${hasLast?'继续练习':'开始学习'}</button>
      </div>
    </section>
    <section class="section"><div class="section-title-row"><h2 class="section-title">今日进度</h2><span class="section-note">只记录今天的作答</span></div>
      <div class="stats-row"><div class="stat"><div class="stat-value">${day.answered}</div><div class="stat-label">已做</div></div><div class="stat"><div class="stat-value">${dayRate}%</div><div class="stat-label">正确率</div></div><div class="stat"><div class="stat-value">${activeMistakeIds().length}</div><div class="stat-label">待复习错题</div></div></div>
    </section>
    <section class="section"><div class="section-title-row"><h2 class="section-title">快速练习</h2></div>
      <div class="quick-actions"><button class="quick" data-start-mode="sequence" data-topic="all"><strong>顺序练习</strong><span>从题库当前位置开始</span></button><button class="quick" data-start-mode="random" data-topic="all"><strong>随机练习</strong><span>打乱题目顺序</span></button><button class="quick" data-action="redo-mistakes"><strong>错题重练</strong><span>${activeMistakeIds().length?`${activeMistakeIds().length} 道待巩固`:'当前没有错题'}</span></button></div>
    </section>
    <section class="section"><div class="section-title-row"><h2 class="section-title">章节练习</h2><button class="ghost" data-nav="practice">查看全部</button></div><div class="list">${TOPICS.map(renderTopicRow).join('')}</div></section>
  </div>`
}
function renderTopicRow(topic){const list=topicQuestions(topic),done=uniqueDoneCount(list),pct=list.length?Math.round(done/list.length*100):0;return `<button class="list-row" data-start-topic="${esc(topic)}" data-mode="sequence"><div><div class="row-title">${esc(topic)}</div><div class="row-meta">已完成 ${done} / ${list.length}</div></div><div class="row-side"><div class="chapter-progress"><span style="width:${pct}%"></span></div>${icon('chev')}</div></button>`}

function renderPractice(){
  const count=QUESTIONS.length;return `<div class="page"><div class="page-head"><div><h1 class="page-title">练习</h1><p class="page-sub">选择一种方式，然后开始做题。</p></div></div>
  <div class="practice-grid"><aside class="mode-panel panel" aria-label="练习方式">${['sequence','random','unseen'].map(m=>`<button class="mode-btn ${practiceMode===m?'active':''}" data-mode-pick="${m}"><span>${MODE_LABELS[m]}</span><small>${m==='sequence'?'按原题顺序':m==='random'?'随机打乱':'只做没做过的'}</small></button>`).join('')}</aside>
  <section class="library"><div class="library-head"><div><div class="library-title">题库章节</div><div class="library-count">共 ${count} 题</div></div><button class="primary" data-start-mode="${practiceMode}" data-topic="all">开始全部</button></div><div class="list">${TOPICS.map(t=>renderPracticeRow(t)).join('')}</div></section></div></div>`
}
function renderPracticeRow(topic){const all=topicQuestions(topic),done=uniqueDoneCount(all),available=practiceMode==='unseen'?all.filter(q=>!state.questionStats[q.id]?.attempts).length:all.length;return `<button class="list-row" data-start-topic="${esc(topic)}" data-mode="${practiceMode}" ${available===0?'disabled':''}><div><div class="row-title">${esc(topic)}</div><div class="row-meta">${practiceMode==='unseen'?`未做 ${available} 题`:`已完成 ${done} / ${all.length}`}</div></div><div class="row-side"><span>${available} 题</span>${icon('chev')}</div></button>`}

function renderMistakes(){
  const ids=activeMistakeIds(),mastered=Object.keys(state.mastered||{}).filter(id=>qById(id)).length;const weak={};ids.forEach(id=>{const q=qById(id);const k=q?.knowledge_point||q?.topic||'综合';weak[k]=(weak[k]||0)+1});const weakRows=Object.entries(weak).sort((a,b)=>b[1]-a[1]).slice(0,6);
  return `<div class="page"><div class="page-head"><div><h1 class="page-title">错题</h1><p class="page-sub">错题不需要一直留着，连续答对两次后自动移出。</p></div>${ids.length?`<button class="primary" data-action="redo-mistakes">开始重练</button>`:''}</div>
    <div class="mistake-summary"><div class="mistake-stat"><strong>${ids.length}</strong><span>待复习</span></div><div class="mistake-stat"><strong>${ids.reduce((s,id)=>s+(state.mistakes[id]?.wrongCount||1),0)}</strong><span>累计答错</span></div><div class="mistake-stat"><strong>${mastered}</strong><span>已巩固</span></div></div>
    ${ids.length?`<section class="section"><div class="section-title-row"><h2 class="section-title">薄弱知识点</h2></div><div class="weak-list">${weakRows.map(([k,n])=>`<div class="weak-row"><div><strong>${esc(k)}</strong><div class="row-meta">${n} 道错题</div></div><button data-weak="${esc(k)}">专项重练</button></div>`).join('')}</div></section>
    <section class="section"><div class="section-title-row"><h2 class="section-title">错题列表</h2></div><div>${ids.map(id=>{const q=qById(id),m=state.mistakes[id];return `<div class="mistake-item" data-open-mistake="${esc(id)}"><div><div class="mistake-q">${esc(cleanQuestion(q))}</div><div class="tagline">${esc(TYPE_NAMES[q.type]||q.type)} · ${esc(q.knowledge_point||q.topic||'综合')} · 答错 ${m?.wrongCount||1} 次</div></div><div class="row-side">${icon('chev')}</div></div>`}).join('')}</div></section>`:`<div class="empty"><strong>现在没有待复习错题</strong><span>继续练习，答错的题会自动收进这里。</span><div style="margin-top:20px"><button class="primary" data-nav="practice">去练习</button></div></div>`}
  </div>`
}

function renderProfile(){const done=uniqueDoneCount(QUESTIONS),day=dailyStats();return `<div class="page"><div class="page-head"><div><h1 class="page-title">我的</h1><p class="page-sub">只保留学习记录和必要设置。</p></div></div>
  <section class="section"><div class="section-title-row"><h2 class="section-title">学习记录</h2></div><div class="stats-row"><div class="stat"><div class="stat-value">${done}</div><div class="stat-label">已做题目</div></div><div class="stat"><div class="stat-value">${rate()}%</div><div class="stat-label">总正确率</div></div><div class="stat"><div class="stat-value">${day.answered}</div><div class="stat-label">今日完成</div></div></div></section>
  <section class="section"><div class="section-title-row"><h2 class="section-title">设置</h2></div><div class="settings-list"><div class="setting-row"><div><div class="setting-label">外观</div><div class="setting-desc">可跟随系统，也可以固定浅色或深色。</div></div><div class="segmented">${[['auto','自动'],['light','浅色'],['dark','深色']].map(([v,n])=>`<button data-theme="${v}" class="${(state.theme||'auto')===v?'active':''}">${n}</button>`).join('')}</div></div><div class="setting-row"><div><div class="setting-label">重置学习记录</div><div class="setting-desc">题库不会被删除，只清除本机的作答、错题和进度。</div></div><button class="danger-btn" data-action="reset">重置</button></div></div></section>
  <section class="section"><div class="section-title-row"><h2 class="section-title">题库</h2></div><div class="list"><div class="list-row" style="cursor:default"><div><div class="row-title">热处理考试题库</div><div class="row-meta">${QUESTIONS.length} 题 · 数据来自 questions.js</div></div><div class="row-side"><span>本地题库</span></div></div></div></section></div>`}

function cleanQuestion(q){let s=String(q?.question||'').trim();if(q?.options?.length){const pos=s.search(/\s+[AＡ][、.．:\s]/);if(pos>20)s=s.slice(0,pos).trim()}return s}
function startSession(list,mode,title,startIndex=0){let qs=[...list];if(mode==='unseen')qs=qs.filter(q=>!state.questionStats[q.id]?.attempts);if(mode==='random')qs=shuffle(qs);if(!qs.length){showToast(mode==='unseen'?'这一部分已经全部做过了':'当前没有可练习题目');return}
  session={ids:qs.map(q=>q.id),mode,title};currentIndex=Math.max(0,Math.min(startIndex,qs.length-1));answerState={};selectedMulti.clear();view='question';document.body.classList.add('in-question');state.lastSession={ids:session.ids,index:currentIndex,mode,title,updatedAt:Date.now()};save();window.scrollTo({top:0,behavior:'auto'});render()}
function currentQuestion(){return session?qById(session.ids[currentIndex]):null}
function resumeLast(){const last=state.lastSession;if(!last?.ids?.length){navigate('practice');return}const qs=last.ids.map(qById).filter(Boolean);if(!qs.length){navigate('practice');return}session={ids:qs.map(q=>q.id),mode:last.mode||'sequence',title:last.title||'继续练习'};currentIndex=Math.min(last.index||0,session.ids.length-1);answerState={};selectedMulti.clear();view='question';document.body.classList.add('in-question');render()}

function renderQuestion(){const q=currentQuestion();if(!q){setTimeout(()=>navigate('practice'),0);return '<div class="empty">题目不存在</div>'}const total=session.ids.length,progress=Math.round((currentIndex+1)/total*100),result=answerState[q.id];return `<div class="question-shell page"><div class="question-top"><button class="icon-btn" data-action="exit-question" aria-label="退出练习">${icon('close')}</button><div class="q-progress-wrap"><div class="q-meta-line"><span>${esc(session.title)}</span><span>${currentIndex+1} / ${total}</span></div><div class="q-progress"><span style="width:${progress}%"></span></div></div><span></span></div>
  <article class="question-card"><div class="type-label">${esc(TYPE_NAMES[q.type]||q.type)}${q.type==='choice'&&answerLabels(q).length>1?' · 多选':''}</div><div class="question-text">${esc(cleanQuestion(q))}</div>${renderAnswerArea(q,result)}${result?renderFeedback(q,result):''}</article></div>
  <footer class="question-footer"><div class="question-footer-inner"><button class="secondary" data-action="prev" ${currentIndex===0?'disabled':''}>上一题</button><div class="footer-spacer"></div><button class="primary" data-action="next">${currentIndex===total-1?'完成':'下一题'}</button></div></footer>`}
function renderAnswerArea(q,result){if(q.type==='choice')return renderChoice(q,result);if(q.type==='truefalse')return renderTF(q,result);if(q.type==='fill')return renderFill(q,result);return renderOpen(q,result)}
function answerLabels(q){const raw=String(q?.answer||'').toUpperCase();const labels=(q?.option_labels?.length?q.option_labels:q?.options?.map((_,i)=>String.fromCharCode(65+i)))||[];return labels.filter(l=>raw.includes(String(l).toUpperCase()))}
function renderChoice(q,result){const answers=answerLabels(q);const multi=answers.length>1;return `<div class="options">${(q.options||[]).map((opt,i)=>{const label=q.option_labels?.[i]||String.fromCharCode(65+i);const chosen=result?.chosen?.includes(label)||selectedMulti.has(label);const correct=answers.includes(label);let cls='';let stateIcon='';if(result){if(correct){cls='correct';stateIcon=icon('check')}else if(chosen){cls='wrong';stateIcon=icon('close')}}else if(chosen)cls='selected';return `<button class="option ${cls}" data-option="${esc(label)}" data-multi="${multi?'1':'0'}" ${result?'disabled':''}><span class="option-letter">${esc(label)}</span><span>${esc(opt)}</span><span class="option-state">${stateIcon}</span></button>`}).join('')}</div>${multi&&!result?`<div class="answer-actions"><button class="primary" data-action="submit-multi" ${selectedMulti.size?'':'disabled'}>提交答案</button></div>`:''}`}
function renderTF(q,result){return `<div class="options">${[['√','正确'],['×','错误']].map(([v,n])=>{const chosen=result?.chosen===v;const correct=q.answer===v;let cls='';let si='';if(result){if(correct){cls='correct';si=icon('check')}else if(chosen){cls='wrong';si=icon('close')}}return `<button class="option ${cls}" data-tf="${v}" ${result?'disabled':''}><span class="option-letter">${v==='√'?'✓':'×'}</span><span>${n}</span><span class="option-state">${si}</span></button>`}).join('')}</div>`}
function renderFill(q,result){if(result)return `<div class="panel" style="padding:14px 16px"><div class="row-meta">你的答案</div><div style="font-weight:650;margin-top:3px">${esc(result.chosen||'未填写')}</div></div>`;return `<div class="fill-wrap"><input class="text-input" id="fillAnswer" autocomplete="off" placeholder="输入你的答案"><button class="primary" data-action="submit-fill">提交</button></div>`}
function renderOpen(q,result){if(!result)return `<button class="secondary" data-action="reveal-open">查看参考答案</button>`;if(!result.selfRated)return `<div class="feedback"><div class="feedback-title">参考答案</div><div class="feedback-text">${textWithBreaks(q.explanation||q.answer||'暂无参考答案')}</div></div><div class="answer-actions"><button class="primary" data-self="correct">我答对了</button><button class="secondary" data-self="wrong">需要再练</button></div>`;return ''}
function renderFeedback(q,result){if((q.type==='shortanswer'||q.type==='calculation')&&!result.selfRated)return '';const correct=result.correct;const answer=formatAnswer(q);const expl=q.explanation||'';return `<div class="feedback ${correct?'correct':'wrong'}"><div class="feedback-title">${correct?'回答正确':'这题需要再看一下'}</div>${!correct&&answer?`<div class="answer-line">正确答案：${textWithBreaks(answer)}</div>`:''}${expl?`<div class="feedback-text">${textWithBreaks(expl)}</div>`:''}<div class="kp-line"><span>知识点</span><span class="kp-chip">${esc(q.knowledge_point||q.topic||'综合')}</span></div></div>`}
function formatAnswer(q){if(q.type==='choice'&&q.options?.length){const labels=answerLabels(q);return labels.map(l=>{const optionLabels=q.option_labels?.length?q.option_labels:q.options.map((_,i)=>String.fromCharCode(65+i));const i=optionLabels.indexOf(l);return i>=0?`${l}. ${q.options[i]}`:l}).join('；')}if(q.type==='truefalse')return q.answer==='√'?'正确':'错误';return String(q.answer||'')}
function fillCorrect(q,input){const a=normalize(q.answer),u=normalize(input);if(!a||!u)return false;if(a===u)return true;const expected=String(q.answer||'').split(/[，,、；;\/]/).map(normalize).filter(Boolean);return expected.length>1&&expected.every(x=>u.includes(x))}
function recordAnswer(q,correct,chosen){const id=String(q.id);const now=Date.now();const qs=state.questionStats[id]||{attempts:0,correct:0,wrong:0};qs.attempts++;if(correct)qs.correct++;else qs.wrong++;qs.lastResult=correct?'correct':'wrong';qs.lastAt=now;state.questionStats[id]=qs;state.stats.total++;if(correct)state.stats.correct++;
  const d=todayKey();state.daily[d]=state.daily[d]||{answered:0,correct:0};state.daily[d].answered++;if(correct)state.daily[d].correct++;
  if(correct&&state.mistakes[id]){state.mistakes[id].correctStreak=(state.mistakes[id].correctStreak||0)+1;if(state.mistakes[id].correctStreak>=2){state.mastered[id]={at:now};delete state.mistakes[id]}}
  if(!correct){const m=state.mistakes[id]||{wrongCount:0,correctStreak:0};m.wrongCount++;m.correctStreak=0;m.lastWrongAt=now;state.mistakes[id]=m;delete state.mastered[id]}
  answerState[id]={correct,chosen,selfRated:true};save()}
function answerChoice(label,multi){const q=currentQuestion();if(!q||answerState[q.id])return;if(multi){selectedMulti.has(label)?selectedMulti.delete(label):selectedMulti.add(label);render();return}recordAnswer(q,answerLabels(q).length===1&&answerLabels(q)[0]===label,label);render()}
function submitMulti(){const q=currentQuestion();if(!q||!selectedMulti.size)return;const chosen=[...selectedMulti].sort().join(''),ans=answerLabels(q).sort().join('');recordAnswer(q,chosen===ans,[...selectedMulti]);selectedMulti.clear();render()}
function submitTF(v){const q=currentQuestion();if(!q||answerState[q.id])return;recordAnswer(q,String(q.answer||'')===v,v);render()}
function submitFill(){const q=currentQuestion();const input=document.getElementById('fillAnswer');if(!q||!input)return;const v=input.value.trim();if(!v){showToast('先输入答案');input.focus();return}recordAnswer(q,fillCorrect(q,v),v);render()}
function revealOpen(){const q=currentQuestion();if(!q)return;answerState[q.id]={correct:null,chosen:null,selfRated:false};render()}
function selfRate(v){const q=currentQuestion();if(!q)return;recordAnswer(q,v==='correct',v);render()}
function nextQuestion(){if(!session)return;if(currentIndex>=session.ids.length-1){document.body.classList.remove('in-question');state.lastSession=null;save();showToast('本组练习已完成');view='home';session=null;render();return}currentIndex++;selectedMulti.clear();state.lastSession={ids:session.ids,index:currentIndex,mode:session.mode,title:session.title,updatedAt:Date.now()};save();window.scrollTo({top:0,behavior:'auto'});render()}
function prevQuestion(){if(currentIndex<=0)return;currentIndex--;selectedMulti.clear();state.lastSession={ids:session.ids,index:currentIndex,mode:session.mode,title:session.title,updatedAt:Date.now()};save();window.scrollTo({top:0,behavior:'auto'});render()}
function redoMistakes(filterKp){let qs=activeMistakeIds().map(qById).filter(Boolean);if(filterKp)qs=qs.filter(q=>(q.knowledge_point||q.topic||'综合')===filterKp);if(!qs.length){showToast('当前没有可重练的错题');return}startSession(qs,'sequence',filterKp?`${filterKp} · 错题`:'错题重练')}
function openMistake(id){const q=qById(id);if(q)startSession([q],'sequence','错题复习')}
function resetState(){if(!confirm('确定清除本机的学习记录、错题和进度吗？题库内容不会删除。'))return;const theme=state.theme;state=freshState();state.theme=theme;save();render();showToast('学习记录已重置')}

function bind(){
  document.querySelectorAll('[data-nav]').forEach(el=>el.addEventListener('click',()=>navigate(el.dataset.nav)));
  document.querySelectorAll('[data-start-topic]').forEach(el=>el.addEventListener('click',()=>{const topic=el.dataset.startTopic,mode=el.dataset.mode||practiceMode;startSession(topicQuestions(topic),mode,topic)}));
  document.querySelectorAll('[data-start-mode]').forEach(el=>el.addEventListener('click',()=>startSession(topicQuestions(el.dataset.topic||'all'),el.dataset.startMode,el.dataset.topic==='all'?MODE_LABELS[el.dataset.startMode]:el.dataset.topic)));
  document.querySelectorAll('[data-mode-pick]').forEach(el=>el.addEventListener('click',()=>{practiceMode=el.dataset.modePick;render()}));
  document.querySelectorAll('[data-option]').forEach(el=>el.addEventListener('click',()=>answerChoice(el.dataset.option,el.dataset.multi==='1')));
  document.querySelectorAll('[data-tf]').forEach(el=>el.addEventListener('click',()=>submitTF(el.dataset.tf)));
  document.querySelectorAll('[data-self]').forEach(el=>el.addEventListener('click',()=>selfRate(el.dataset.self)));
  document.querySelectorAll('[data-theme]').forEach(el=>el.addEventListener('click',()=>setTheme(el.dataset.theme)));
  document.querySelectorAll('[data-weak]').forEach(el=>el.addEventListener('click',()=>redoMistakes(el.dataset.weak)));
  document.querySelectorAll('[data-open-mistake]').forEach(el=>el.addEventListener('click',()=>openMistake(el.dataset.openMistake)));
  document.querySelectorAll('[data-action]').forEach(el=>el.addEventListener('click',()=>{
    const a=el.dataset.action;if(a==='continue')resumeLast();else if(a==='start-default')startSession(topicQuestions(TOPICS[0]||'all'),'sequence',TOPICS[0]||'顺序练习');else if(a==='redo-mistakes')redoMistakes();else if(a==='submit-multi')submitMulti();else if(a==='submit-fill')submitFill();else if(a==='reveal-open')revealOpen();else if(a==='next')nextQuestion();else if(a==='prev')prevQuestion();else if(a==='exit-question'){document.body.classList.remove('in-question');view='home';session=null;render()}else if(a==='reset')resetState();
  }));
  const input=document.getElementById('fillAnswer');if(input)input.addEventListener('keydown',e=>{if(e.key==='Enter')submitFill()});
}
document.addEventListener('keydown',e=>{if(view!=='question'||e.altKey||e.ctrlKey||e.metaKey)return;const q=currentQuestion();if(!q)return;if(q.type==='choice'&&!answerState[q.id]&&/^[1-9]$/.test(e.key)){const i=Number(e.key)-1;if(q.options?.[i])answerChoice(q.option_labels?.[i]||String.fromCharCode(65+i),answerLabels(q).length>1)}else if(e.key==='ArrowRight'&&answerState[q.id])nextQuestion();else if(e.key==='ArrowLeft')prevQuestion()});
render();
</script>
</body>
</html>
