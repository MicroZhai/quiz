<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#176b5a">
<meta name="color-scheme" content="light dark">
<meta name="application-name" content="刷题学习">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="刷题学习">
<title>刷题学习</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
html,body{width:100%;height:100%;margin:0;background:#f6f5f0;overflow:hidden}
#app-frame{display:block;width:100%;height:100dvh;border:0;background:#f6f5f0}
.fallback{display:none;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;color:#1f2724;padding:32px}
.no-js #app-frame{display:none}.no-js .fallback{display:block}
</style>
</head>
<body>
<iframe id="app-frame" src="quiz.html" title="刷题学习"></iframe>
<noscript><div class="fallback">需要启用 JavaScript 才能使用刷题学习。</div></noscript>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./service-worker.js', { scope: './' })
      .catch(error => console.warn('Service Worker 注册失败：', error));
  });
}
</script>
</body>
</html>
